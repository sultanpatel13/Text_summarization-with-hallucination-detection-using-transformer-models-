<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            max-width: 480px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        h1 { font-size: 48px; margin: 0 0 12px; color: #4f46e5; }
        h2 { font-size: 20px; margin: 0 0 16px; color: #1e293b; }
        p { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        a {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        a:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The requested page could not be found. Please check the URL or return to the application homepage.</p>
        <a href="/">Back to Summarizer</a>
    </div>
</body>
</html>
